name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      # `npm ci` installs from the committed lockfile and fails if package.json
      # and the lockfile disagree, which is the point of pinning them.
      - run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: the demo page's bundle is not stale
        run: npm run check:web

      - name: the numbers in the README match what the code measures
        run: npm run check:measure

      - name: test suite
        run: npm test

      # Run the headline claims as their own steps so a regression is visible in
      # the job list rather than buried in test output.
      - name: the planted fixtures and the negative control
        run: node src/cli.js fixtures

      - name: the three real streams
        run: node src/cli.js streams

      - name: the one-command demo
        run: node src/cli.js demo

  windows:
    # flume is developed on Windows and its module resolution depends on
    # pathToFileURL. Running the suite on both keeps that honest.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci
      - run: npm test
